name: Build AutoPacer v10

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure CMake (x64 Release)
      run: |
        cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Rename DLL to ASI
      run: |
        copy build\Release\AutoPacer.dll build\Release\AutoPacer.asi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoPacer-v10
        path: build\Release\AutoPacer.asi
        retention-days: 30
