name: Build AutoPacer v10

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: cmake -B build -S . -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Rename to ASI
      run: copy build\Release\AutoPacer.dll build\Release\AutoPacer.asi

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AutoPacer-v10
        path: build\Release\AutoPacer.asi
        retention-days: 30
