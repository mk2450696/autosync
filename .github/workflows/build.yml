name: Build AutoPacer
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install MinHook Library
      run: vcpkg install minhook:x64-windows
      
    - name: Compile the DLL
      run: |
        cl.exe /O2 /LD /MT /EHsc dllmain.cpp /I C:\vcpkg\installed\x64-windows\include /link /LIBPATH:C:\vcpkg\installed\x64-windows\lib minhook.lib d3d11.lib dxgi.lib user32.lib /OUT:AutoPacer.dll
        
    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: AutoPacer-DLL
        path: AutoPacer.dll
